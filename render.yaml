# Render "Blueprint" — connect this repo on Render and it reads this file to set up the
# backend service automatically. Secrets (sync: false) are never stored here; Render prompts
# for their actual values in its dashboard the first time you deploy.
services:
  - type: web
    name: field-service-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/ping
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_DAYS
        value: "30"
      - key: BOOTSTRAP_OWNER_PHONE
        sync: false
      - key: BOOTSTRAP_OWNER_PIN
        sync: false
      - key: BOOTSTRAP_OWNER_NAME
        value: App Owner
      - key: PHOTO_RETENTION_DAYS
        value: "30"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: field-service-dashboard
    runtime: static
    rootDir: owner_dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: owner_dashboard/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://field-service-backend-76kh.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
